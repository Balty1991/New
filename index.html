<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetAnalytics Fixed</title>
  <link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>
  <div class="app">
    <header class="topbar card">
      <div>
        <h1>⚽ BetAnalytics Fixed</h1>
        <p class="muted">Varianta funcțională pentru GitHub Pages. Datele sunt aduse prin GitHub Actions și salvate local în repo.</p>
      </div>
      <div class="toolbar">
        <button id="refreshBtn">Reîncarcă datele</button>
      </div>
    </header>

    <section id="messageBox" class="message hidden"></section>

    <section class="stats">
      <div class="card stat"><strong id="statTotal">0</strong><span>Total</span></div>
      <div class="card stat"><strong id="statTop">0</strong><span>Top</span></div>
      <div class="card stat"><strong id="statValue">0</strong><span>Value</span></div>
      <div class="card stat"><strong id="statRisky">0</strong><span>Risky</span></div>
    </section>

    <section class="card helper">
      <strong>Important:</strong> dacă vezi încă zerouri după refresh, deschide pagina cu <code>?v=3</code> la finalul URL-ului sau șterge cache-ul site-ului din browser.
    </section>

    <section class="card filters">
      <button class="filter-btn active" data-filter="all">Toate</button>
      <button class="filter-btn" data-filter="top">Top</button>
      <button class="filter-btn" data-filter="value">Value</button>
      <button class="filter-btn" data-filter="risky">Risky</button>
    </section>

    <main id="results" class="results"></main>
  </div>

  <script src="app.js?v=3"></script>
</body>
</html>
