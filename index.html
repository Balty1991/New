<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetAnalytics Pro Dark</title>
  <link rel="stylesheet" href="styles.css?v=9" />
</head>
<body>
  <div class="app-shell">
    <header class="hero-panel">
      <div>
        <div class="eyebrow">BET ANALYTICS • DARK EDITION</div>
        <h1>Pronosticuri ordonate, filtrabile și mai ușor de citit</h1>
        <p>Interfață modernă, dark theme, filtrare după interval, tip de piață, interval de probabilitate și sortare.</p>
      </div>
      <button id="refreshBtn">Reîncarcă datele</button>
    </header>

    <section id="messageBox" class="message hidden"></section>

    <section class="toolbar-panel">
      <div class="toolbar-grid">
        <label>
          <span>Interval</span>
          <select id="intervalSelect">
            <option value="all">Toate zilele din fișier</option>
            <option value="today">Doar azi</option>
            <option value="24h">Următoarele 24h</option>
            <option value="3d">Următoarele 3 zile</option>
          </select>
        </label>
        <label>
          <span>Tip pronostic</span>
          <select id="typeSelect">
            <option value="all">Toate</option>
            <option value="winner">1X2</option>
            <option value="goals">Goluri</option>
            <option value="btts">BTTS</option>
          </select>
        </label>
        <label>
          <span>Interval probabilitate</span>
          <select id="minProbSelect">
            <option value="all">Toate</option>
            <option value="45-60">45% - 60%</option>
            <option value="60-70">60% - 70%</option>
            <option value="70-80" selected>70% - 80%</option>
            <option value="80-85">80% - 85%</option>
            <option value="85-101">85%+</option>
          </select>
        </label>
        <label>
          <span>Sortare</span>
          <select id="sortSelect">
            <option value="prob">Probabilitate</option>
            <option value="score">Scor intern</option>
            <option value="date">Dată eveniment</option>
          </select>
        </label>
      </div>
    </section>

    <section class="stats-grid">
      <div class="stat-card"><span>Total</span><strong id="statTotal">0</strong></div>
      <div class="stat-card"><span>Scor ridicat</span><strong id="statHigh">0</strong></div>
      <div class="stat-card"><span>Scor mediu</span><strong id="statAverage">0</strong></div>
      <div class="stat-card"><span>Cea mai mare probabilitate</span><strong id="statTopProb">0%</strong></div>
    </section>

    <main id="results" class="results-stack"></main>
  </div>

  <script src="app.js?v=8"></script>
</body>
</html>
